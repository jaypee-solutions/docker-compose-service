---
- name: Copy systemd configuration
  become: true
  ansible.builtin.template:
    src: systemd.service
    dest: /etc/systemd/system/{{ docker_compose_service_name }}.service
  register: docker_compose_service_changed
  notify: restart service

- name: Reload systemd daemon
  become: true
  ansible.builtin.command: /bin/systemctl daemon-reload
  when: docker_compose_service_changed.changed

- name: Enable systemd service
  become: true
  ansible.builtin.service:
    name: "{{ docker_compose_service_name }}"
    enabled: true
